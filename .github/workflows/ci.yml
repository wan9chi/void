name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]
  workflow_call:
    inputs:
      skip_windows:
        type: boolean
        required: false
        default: false

permissions: {}

jobs:
  checks:
    name: build and typecheck (${{ matrix.os }})
    runs-on: ${{ matrix.os == 'ubuntu-latest' && github.repository == 'voidzero-dev/void' && 'blacksmith-4vcpu-ubuntu-2404' || matrix.os }}
    permissions:
      contents: read
      # Remote cache uploads authenticate with a GitHub Actions OIDC token.
      id-token: write
    env:
      # Remote task cache, on when the repository variable is set. Pushes and pull requests from
      # this repository upload results; fork pull requests get no OIDC token and only download.
      # Replay: pull requests from fork/ branches stand in for fork pull requests.
      VP_REMOTE_CACHE_URL: ${{ vars.VP_REMOTE_CACHE_URL }}
      VP_REMOTE_CACHE: ${{ !vars.VP_REMOTE_CACHE_URL && 'off' || (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository && !startsWith(github.head_ref, 'fork/')) && 'read-write' || 'read' }}
    strategy:
      fail-fast: false
      matrix:
        os: '${{ ((github.event_name == ''push'' || contains(github.event.pull_request.labels.*.name, ''test: windows'')) && !inputs.skip_windows) && fromJSON(''["ubuntu-latest","windows-latest"]'') || fromJSON(''["ubuntu-latest"]'') }}'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/test-setup
      # Build every playground once per OS for complete build/type coverage.
      # Integration tests build their own selected fixtures in separate checkouts.
      - run: vp run --cache build:all
      # Replay diagnostics: the full summary of the build:all run, with each task's cache status.
      - if: ${{ !cancelled() }}
        run: vp run --last-details
      # Replay check: hash what the cached build left, to compare with a fresh build at the end.
      - if: ${{ !cancelled() }}
        run: node .github/replay/outputs.mjs snapshot "${{ runner.temp }}/cached-outputs.json" "${{ runner.temp }}/cached-outputs"
      - run: vp run build:docs
      - run: node test/check-playground-build-artifacts.mjs
      - run: vp run check
      # Replay check: rebuild from a clean tree without the cache, and compare the outputs with the
      # cached build's. A difference in a task that hit is a false hit unless the file is
      # nondeterministic. These steps don't affect the job's result.
      - if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        env:
          VP_REMOTE_CACHE: 'off'
        # Like CI's install, whose `prepare` script runs build:core before build:all: the platform
        # runtime bundle reads void's dist when it exists, without depending on void.
        run: |
          git checkout -- . && git clean -fdxq -e node_modules
          vp run --no-cache build:core
          vp run --no-cache build:all
      - if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          node .github/replay/outputs.mjs snapshot "${{ runner.temp }}/fresh-outputs.json"
          node .github/replay/outputs.mjs compare "${{ runner.temp }}/cached-outputs.json" "${{ runner.temp }}/fresh-outputs.json" "${{ runner.temp }}/cached-outputs"
          node .github/replay/outputs.mjs collect "${{ runner.temp }}/cached-outputs.json" "${{ runner.temp }}/fresh-outputs.json" "${{ runner.temp }}/cached-outputs" "${{ runner.temp }}/replay-diff"
      - if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: replay-diff-${{ matrix.os }}
          path: ${{ runner.temp }}/replay-diff
          if-no-files-found: ignore
          retention-days: 30
